<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>فلوسي بوضوح</title>
  <meta name="description" content="نظامك المالي الشخصي: سجل الدخل والمصروفات والميزانية وأهداف الادخار. يعمل بدون إنترنت وبياناتك على جهازك فقط.">
  <meta name="theme-color" content="#5E7154">
  <meta name="color-scheme" content="light">
  <!-- iOS: تشغيل كتطبيق مستقل بعد «إضافة إلى الشاشة الرئيسية» -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="فلوسي">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="format-detection" content="telephone=no">
  <!-- لا اتصال بأي جهة خارجية: كل الموارد من نفس الموقع -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <header class="top">
    <div class="brand"><img src="icons/icon-192.png" alt="" width="32" height="32"><span>فلوسي بوضوح</span></div>
    <button class="icon-btn" id="btn-more" aria-label="المزيد: الإعدادات والنسخ الاحتياطي">⚙︎</button>
  </header>
  <div id="month-bar" class="month-bar" hidden>
    <button class="icon-btn" data-act="month-prev" aria-label="الشهر السابق">›</button>
    <label class="month-pick"><span class="sr">الشهر</span><select id="sel-month"></select></label>
    <label class="month-pick"><span class="sr">السنة</span><select id="sel-year"></select></label>
    <button class="icon-btn" data-act="month-next" aria-label="الشهر التالي">‹</button>
  </div>
  <div id="banner" class="banner" hidden></div>
  <main id="view" tabindex="-1" aria-live="polite"><p class="loading">جارٍ التحميل…</p></main>
  <button id="fab" class="fab" aria-label="إضافة عملية" hidden>+</button>
  <nav class="tabs" aria-label="التنقل">
    <a href="#/" data-tab="home"><span class="ti">◉</span>الملخص</a>
    <a href="#/log" data-tab="log"><span class="ti">☰</span>السجل</a>
    <a href="#/budget" data-tab="budget"><span class="ti">◔</span>الميزانية</a>
    <a href="#/goals" data-tab="goals"><span class="ti">✦</span>الأهداف</a>
    <a href="#/review" data-tab="review"><span class="ti">✓</span>المراجعة</a>
  </nav>
  <div id="sheet-wrap" class="sheet-wrap" hidden>
    <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
      <div class="sheet-head"><h2 id="sheet-title"></h2><button class="icon-btn" data-act="close-sheet" aria-label="إغلاق">✕</button></div>
      <div id="sheet-body"></div>
    </div>
  </div>
  <div id="toast" class="toast" role="status" aria-live="assertive" hidden></div>
  <noscript><p class="noscript">يحتاج التطبيق إلى تفعيل JavaScript في المتصفح.</p></noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
